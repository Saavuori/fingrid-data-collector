name: CI

# The Docker build only runs on pushes to main, so until this existed a pull
# request had no checks at all. Auto-merge needs something to wait for.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# One run per branch; a new push supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Rust backend ──────────────────────────────────────────────────────────
  backend:
    name: cargo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Dockerfile builds on rust:alpine, i.e. current stable.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # --locked fails rather than silently re-resolving, so a Dependabot PR
      # that edits Cargo.toml without refreshing Cargo.lock is caught here.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked

  # ── Vite frontend ─────────────────────────────────────────────────────────
  frontend:
    name: vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Matches the frontend-builder stage in the Dockerfile. Bump both together.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b && vite build` — the typecheck is the half that catches a
      # dependency bump changing types out from under us.
      - name: Build
        run: npm run build
