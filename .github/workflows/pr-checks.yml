name: PR Checks

# These two job names are not cosmetic: main's branch protection requires the
# contexts "cargo" and "vite build" by name. They were required long before any
# workflow produced them, which left auto-merge waiting on checks that could
# never report. Renaming a job here silently breaks merging again.
on:
  pull_request:
    branches: ["main"]

# No paths-ignore on purpose: a required status check must always report a
# result, otherwise doc-only PRs stay pending forever and block merge.

permissions:
  contents: read

jobs:
  cargo:
    name: cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # --locked fails if Cargo.lock would have to change, which is what makes
      # a dependency PR's lockfile the thing under test rather than a suggestion.
      - name: Build
        working-directory: backend
        run: cargo build --locked

      - name: Test
        working-directory: backend
        run: cargo test --locked

  vite-build:
    name: vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 matches the frontend-builder stage in the Dockerfile, so CI
      # compiles on the same major that ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `npm run build` runs `tsc -b && vite build` — this is what proves the
      # app actually compiles, types included.
      - name: Build
        working-directory: frontend
        run: npm run build
